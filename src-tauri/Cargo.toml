[package]
name = "examoffice"
version = "0.1.0"
description = "Free, open-source typing tutor & exam platform"
authors = ["Examoffice Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/examoffice/examoffice"

[lib]
name = "examoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

# Typing engine
fontdue = "0.7"
ab_glyph = "0.2"
unicode-segmentation = "1.10"

# Document handling
docx-rs = "0.4"
calamine = { version = "0.22", features = ["chrono", "dates"] }
zip = "0.6"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = { version = "0.8", features = ["std_rng"] }
sha2 = "0.10"

# Database
rusqlite = { version = "0.29", features = ["bundled", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"

# Utils
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
parking_lot = "0.12"
once_cell = "1.19"
directories = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
members = []